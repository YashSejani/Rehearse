name: app2-bad-db-password
description: orders is rolled out with a wrong database password and crashes at start
source: ours (like AIOpsLab's wrong DB credentials, for Postgres)
ask: orders
inject:
  - kubectl: [-n, "{ns}", set, env, deployment/orders, DB_PASSWORD=wrong-password]
wait_for: {issue: [CrashLoopBackOff, Error, NotReady], timeout: 240}
expected: {fault: true, targets: [orders, postgres], categories: [config, dependency], actions: [RollbackDeploy]}
cleanup:
  - kubectl: [-n, "{ns}", rollout, undo, deployment/orders]
