# Rehearse configuration. Everything app- or cluster-specific lives here, not in Go code.

kube:
  context: kind-rehearse          # kubeconfig context; empty = current context

app:
  namespace: hotel
  service_label: io.kompose.service   # pod/deployment label that names the service
  # Which user-facing endpoints (k6 `endpoint` tag) each service serves. Used to show request
  # rate / errors / latency for a backend service that has no metrics of its own.
  endpoints:
    frontend: [hotels, recommendations, user, reservation]
    search: [hotels]
    geo: [hotels]
    rate: [hotels]
    profile: [hotels]
    recommendation: [recommendations]
    user: [user, reservation]
    reservation: [reservation]

# Backends are reached through the Kubernetes API service proxy ("namespace/service:port"),
# so no port-forward is needed. Set `url` instead for a backend outside the cluster.
prometheus:
  service: monitoring/kube-prometheus-stack-prometheus:9090
loki:
  service: monitoring/loki:3100
  events_selector: '{job="kubernetes-events"}'

jaeger:
  service: hotel/jaeger:16686   # traces; used by `rehearse learn` for the service map

limits:
  log_lines: 20        # max distinct (deduplicated) log lines returned
  issues: 20           # max problems returned by status
  changes: 15          # max change events returned
  timeout_seconds: 15  # per external call

# The diagnosing agent (Phase 3). Any OpenAI-compatible endpoint works.
agent:
  base_url: http://127.0.0.1:11434/v1
  model: rehearse-base       # qwen2.5:3b with num_ctx 8192 (deploy/ollama/Modelfile.base)
  max_steps: 8
  temperature: 0
  max_tokens: 768            # per reply; a looping model is cut off (~3 min on CPU)
  trace_dir: traces
  always_ask_model: false   # false = triage: a healthy target is answered without the model

# App Knowledge + RAG (Phase 5). Postgres runs in namespace rehearse (deploy/rehearse/).
knowledge:
  service: rehearse/postgres:5432
  secret: rehearse/rehearse-db   # password key; created by `make rehearse-db`, never committed
  embed_model: nomic-embed-text
  top_k: 5
  rag: true                      # rehearse why --no-rag turns it off
  sources: [knowledge/runbooks, README-FIRST.md, docs/context/hotelreservation.md]

# Safety Gate (Phase 6): a separate service, the only thing that writes to the cluster.
gate:
  service: rehearse/gate:8080
  token_secret: rehearse/rehearse-gate   # created by `make gate`, never committed
