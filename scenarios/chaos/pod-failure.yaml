apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: rehearse-pod-failure
  namespace: hotel
spec:
  action: pod-failure
  mode: one
  duration: "10m"
  selector:
    namespaces: [hotel]
    labelSelectors:
      io.kompose.service: recommendation
