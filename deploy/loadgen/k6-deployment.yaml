apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          args: ["run", "--quiet", "-o", "experimental-prometheus-rw", "/scripts/k6-script.js"]
          env:
            - name: TARGET
              value: http://frontend.hotel.svc:5000
            - name: RATE
              value: "5"
            - name: TARGET_NS          # tag on every metric: which copy of the app this is
              value: hotel
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write
            - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
              value: 10s
            # Latency as a native histogram (k6_http_req_duration_seconds): Prometheus computes
            # percentiles over any window. k6's ready-made p95 is cumulative since k6 started,
            # so a few minutes of slow requests barely move it (found in Phase 4).
            - name: K6_FEATURES
              value: native-histograms
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-script
