apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rehearse
  labels: {app.kubernetes.io/name: postgres}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: rehearse
  labels: {app.kubernetes.io/name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg17
          env:
            - {name: POSTGRES_USER, value: rehearse}
            - {name: POSTGRES_DB, value: rehearse}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: rehearse-db, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: [pg_isready, -U, rehearse, -d, rehearse]}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
