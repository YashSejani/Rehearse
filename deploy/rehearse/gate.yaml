# The Safety Gate: its own ServiceAccount with only the verbs its action catalogue needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rehearse-gate
  namespace: rehearse
---
# In the app namespace: read what it needs, and PATCH deployments (the only write).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rehearse-gate
  namespace: hotel
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events, services, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch]
---
# Sandbox rehearsal (Phase 7): create/delete temporary namespaces and bind itself, inside
# them only, to rehearse-sandbox-admin. Kyverno (deploy/policies/sandbox-only.yaml) makes sure
# these can only be namespaces called rehearse-sbx-*.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rehearse-gate-sandbox
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [rehearse-sandbox-admin]
    verbs: [bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rehearse-gate-sandbox
subjects:
  - {kind: ServiceAccount, name: rehearse-gate, namespace: rehearse}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rehearse-gate-sandbox}
---
# What the gate may do INSIDE a sandbox namespace (bound per sandbox, never cluster-wide).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rehearse-sandbox-admin
rules:
  - apiGroups: ["", apps]
    resources: [configmaps, services, persistentvolumeclaims, deployments, pods, replicasets]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rehearse-gate
  namespace: hotel
subjects:
  - {kind: ServiceAccount, name: rehearse-gate, namespace: rehearse}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rehearse-gate}
---
apiVersion: v1
kind: Service
metadata:
  name: gate
  namespace: rehearse
  labels: {app.kubernetes.io/name: gate}
spec:
  selector: {app.kubernetes.io/name: gate}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
  namespace: rehearse
  labels: {app.kubernetes.io/name: gate}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gate}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gate}
    spec:
      serviceAccountName: rehearse-gate
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: gate
          image: rehearse-gate:set-by-make   # `make gate` sets the git-commit tag
          args: [--config, /etc/rehearse/config.yaml]
          env:
            - name: REHEARSE_GATE_TOKEN
              valueFrom: {secretKeyRef: {name: rehearse-gate, key: token}}
            - name: REHEARSE_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: rehearse-db, key: password}}
            - name: REHEARSE_DB_DSN
              value: postgres://rehearse:$(REHEARSE_DB_PASSWORD)@postgres.rehearse.svc:5432/rehearse?sslmode=disable
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/rehearse}
      volumes:
        - name: config
          configMap: {name: gate-config}
