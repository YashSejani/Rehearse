# "shop": a small app that is deliberately unlike HotelReservation (HTTP, standard
# app.kubernetes.io labels, dependencies in env vars, Postgres instead of MongoDB).
# Password Secret shop-db is created by `make app2` (never committed).
apiVersion: v1
kind: Namespace
metadata: {name: app2}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: app2, labels: {app.kubernetes.io/name: postgres}}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: app2, labels: {app.kubernetes.io/name: postgres}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg17   # same image as Rehearse's own DB: no extra download
          env:
            - {name: POSTGRES_USER, value: shop}
            - {name: POSTGRES_DB, value: shop}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: shop-db, key: password}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, shop]}, periodSeconds: 5}
          resources: {requests: {cpu: 20m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog, namespace: app2, labels: {app.kubernetes.io/name: catalog}}
spec:
  selector: {app.kubernetes.io/name: catalog}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: app2, labels: {app.kubernetes.io/name: catalog}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: catalog}}
  template:
    metadata: {labels: {app.kubernetes.io/name: catalog}}
    spec:
      containers:
        - name: catalog
          image: rehearse-shop:set-by-make
          args: [catalog]
          env: [{name: CACHE_MB, value: "8"}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: orders, namespace: app2, labels: {app.kubernetes.io/name: orders}}
spec:
  selector: {app.kubernetes.io/name: orders}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: app2, labels: {app.kubernetes.io/name: orders}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: orders}}
  template:
    metadata: {labels: {app.kubernetes.io/name: orders}}
    spec:
      containers:
        - name: orders
          image: rehearse-shop:set-by-make
          args: [orders]
          env:
            - {name: CATALOG_URL, value: "http://catalog:8080"}
            - {name: DB_HOST, value: postgres}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: shop-db, key: password}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
